[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-research"
version = "0.1.1"
description = "Export and analyze public YouTube channel video histories from the command line"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "vedant" }]
keywords = [
  "youtube",
  "youtube-api",
  "youtube-data-api",
  "channel-analytics",
  "research",
  "cli",
  "python",
  "osint",
  "csv",
  "data-export",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "platformdirs>=4,<5",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/vedntp/yt-research"
Documentation = "https://github.com/vedntp/yt-research/tree/main/docs"
Issues = "https://github.com/vedntp/yt-research/issues"
Source = "https://github.com/vedntp/yt-research"

[project.scripts]
yt-research = "yt_research.cli:app"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_research"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/src",
  "/tests",
  "/docs",
  "/integrations",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["yt_research"]

[tool.coverage.report]
show_missing = true
skip_covered = true
